# Oculta a versão do nginx no header Server: e nas páginas de erro
# padrão (evita fingerprinting fácil de CVEs conhecidas da versão exata).
server_tokens off;

# Bloqueia acessos diretos via IP e domínios não reconhecidos
server {
    listen 80 default_server;
    server_name _;
    
    # O 444 é um código exclusivo do Nginx que fecha a conexão 
    # imediatamente sem enviar absolutamente nada de volta para o bot
    return 444; 
}

# HTTP -> HTTPS (mantém ACME em HTTP)
server {
  listen 80;
  listen [::]:80; # Boa prática adicionar IPv6, já que o Let's Encrypt tenta usá-lo
  server_name igrejabatistajmv.com.br www.igrejabatistajmv.com.br;

  # 1. Rota exclusiva para o desafio do Certbot (NÃO redireciona)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location ~* ^/(category|author|wp-content|wp-includes|202[0-5]) {
    return 301 https://www.igrejabatistajmv.com.br/;
  }

  # 2. Redireciona todo o RESTO (tráfego normal do site) para HTTPS,
  # já consolidando direto no host canônico (www) num só hop.
  location / {
    return 301 https://www.igrejabatistajmv.com.br$request_uri;
  }
}

# Domínio raiz (sem www) em HTTPS: só redireciona pro host canônico.
# Evita conteúdo duplicado (raiz e www servindo o mesmo site sem redirect).
server {
  listen 443 ssl;
  http2 on;
  server_name igrejabatistajmv.com.br;

  ssl_certificate     /etc/letsencrypt/live/www.igrejabatistajmv.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.igrejabatistajmv.com.br/privkey.pem;

  location /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
  }

  location / {
    return 301 https://www.igrejabatistajmv.com.br$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.igrejabatistajmv.com.br;

  ssl_certificate     /etc/letsencrypt/live/www.igrejabatistajmv.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.igrejabatistajmv.com.br/privkey.pem;

  location /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
  }

  location ~* ^/(category|author|wp-content|wp-includes|202[0-5]) {
    return 301 https://$host/;
  }

  location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
  }

  # Report-Only por enquanto: valide em produção (navegação completa com o
  # Console do DevTools aberto, sem violações) antes de trocar o nome do
  # header para "Content-Security-Policy" (enforcing).
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://priority-robots-visitor-administration.trycloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.youtube.com https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://priority-robots-visitor-administration.trycloudflare.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  location ~* ^/(stalker_portal|streaming|ministra|wp-admin|wp-login|xmlrpc\.php|vendor/) {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }
}
